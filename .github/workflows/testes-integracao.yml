
name: Testes de integracao economica

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 2"

permissions:
  contents: read

jobs:
  testes-integracao:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pytest
        run: |
          python -m pip install "pytest>=8,<10"

      - name: Executar testes unitarios
        run: |
          python -m pytest integracao/test_contrato.py -v

      - name: Testar API publicada
        run: |
          python integracao/verificar_api.py

      - name: Salvar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-integracao
          path: integracao/resultados/
          if-no-files-found: warn
