
name: Auditoria do pipeline economico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar pytest
        run: |
          python -m pip install "pytest>=8,<10"

      - name: Executar testes
        run: |
          python -m pytest auditoria/test_auditor.py -v

      - name: Executar auditoria demonstrativa
        run: |
          python auditoria/executar_demo.py

      - name: Salvar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-auditoria
          path: auditoria/resultados/
          if-no-files-found: warn
          retention-days: 30
