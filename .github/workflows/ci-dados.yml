
name: CI - Engenharia de Dados

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar-codigo:
    name: Validar codigo e testes
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline_cloud/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline_cloud/requirements.txt

      - name: Verificar sintaxe Python
        run: |
          python -m compileall -q \
            pipeline_cloud/src \
            auditoria \
            integracao \
            qualidade \
            rastreabilidade

      - name: Testar pipeline economico
        working-directory: pipeline_cloud
        run: |
          python -m pytest tests/ -v

      - name: Testar auditoria
        run: |
          python -m pytest auditoria/test_auditor.py -v

      - name: Testar contrato de dados
        run: |
          python -m pytest integracao/test_contrato.py -v

      - name: Testar qualidade dos dados
        run: |
          python -m pytest qualidade/test_validacao.py -v

      - name: Finalizar verificacao
        run: |
          echo "Validacoes de CI concluidas."
