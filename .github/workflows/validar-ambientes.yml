
name: Validar ambientes DataOps

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar-ambientes:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar pytest
        run: |
          python -m pip install "pytest>=8,<10"

      - name: Validar configuracao
        run: |
          python config/validar_ambientes.py

      - name: Executar testes
        run: |
          python -m pytest config/test_ambientes.py -v
