
name: Monitoramento do dashboard economico

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  verificar-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar disponibilidade
        run: |
          python monitoramento/verificar_servico.py

      - name: Salvar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-monitoramento
          path: monitoramento/resultados/
          if-no-files-found: warn
