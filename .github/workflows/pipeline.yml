
name: Pipeline economico diario

on:
  workflow_dispatch:

  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: read

concurrency:
  group: pipeline-economico-producao
  cancel-in-progress: false

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline_cloud/requirements.txt

      - name: Executar testes
        working-directory: pipeline_cloud
        run: |
          python -m pytest tests/ -v

      - name: Executar pipeline com auditoria
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python pipeline_cloud/src/auditar_execucao.py

      - name: Salvar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_id }}
          path: pipeline_cloud/dados/
          if-no-files-found: warn
          retention-days: 7
